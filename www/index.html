<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff6fa">
  <title>Extempore Prep</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app" class="app">
    <nav id="rail" class="rail" aria-label="Sections"></nav>
    <div class="main">
      <header id="topbar" class="topbar">
        <button id="backBtn" class="icon-btn" aria-label="Back">‹</button>
        <h1 id="title">Extempore Prep</h1>
        <div id="topbarRight" class="topbar-right"></div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-card"><div id="sheetBody"></div></div>
  </div>
  <div id="confetti" class="confetti" aria-hidden="true"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
